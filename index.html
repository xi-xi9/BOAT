<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>借光的星</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="借光的星">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image" content="https://github.com/user-attachments/assets/2c492229-39ba-4ba5-b4fb-372cf817ebb0">
</head>
<style>
  :root{
    --bg-deep:#F7E1E9;
    --bg-mid:#FDF3F6;
    --bg-outer:#C98CA3;
    --ink:#3A2430;
    --muted:#A67A8A;
    --accent:#C24F79;
    --gold:#C9A57A;
    --line: rgba(194,79,121,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{
    scroll-behavior:smooth;
    overflow-x:hidden;
    width:100%;
  }
  body{
    background: var(--bg-deep);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    width:100%;
  }

  /* ---------- HERO ---------- */
  .hero{
    padding: 6vh 6vw 2rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    }
  .hero::before{
    content:'';
    position:absolute;
    top:-5%; left:50%;
    transform:translateX(-50%);
    width:520px; height:520px;
    max-width:100vw;
    background: radial-gradient(circle, var(--bg-mid) 0%, rgba(253,243,246,0) 70%);
    pointer-events:none;
    z-index:0;
  }
  .hero > *{ position:relative; z-index:1; }
  .freq{
    font-size:0.75rem;
    letter-spacing:0.35em;
    color:var(--accent);
    opacity:0.75;
    margin-bottom:2rem;
    animation:pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.4;}
    50%{opacity:0.9;}
  }
  .title{
    font-weight:300;
    font-size:clamp(1.6rem, 4.2vw, 2.4rem);
    letter-spacing:0.08em;
    color:var(--ink);
    margin-bottom:0.9rem;
  }
  .artist{
    font-weight:300;
    font-size:0.95rem;
    letter-spacing:0.25em;
    color:var(--muted);
    margin-bottom:1.1rem;
  }
  .credits{
    font-size:0.68rem;
    letter-spacing:0.12em;
    color:var(--muted);
    opacity:0.6;
    display:flex;
    gap:1.4rem;
    margin-bottom:4rem;
  }

  /* ---------- SONAR / DISC ---------- */
  .sonar-wrap{
    position:relative;
    width:132px; height:132px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:2.6rem;
  }
  .ring{
    position:absolute;
    width:98px; height:98px;
    border:1px solid var(--accent);
    border-radius:50%;
    opacity:0;
    animation:ripple 3.6s ease-out infinite;
    will-change: transform, opacity;
  }
  .ring:nth-child(2){ animation-delay:1.8s; }
  @keyframes ripple{
    0%{ transform:scale(1); opacity:0.45; }
    100%{ transform:scale(2.15); opacity:0; }
  }
  .disc{
    position:relative;
    z-index:2;
    width:98px; height:98px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(194,79,121,0.18),
      0 10px 24px -12px rgba(58,36,48,0.32);
  }
  .disc img{
    display:block;
    width:100%; height:100%;
    object-fit:cover;
    animation:spin 7s linear infinite;
    animation-play-state:paused;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .play-btn-mini{
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:50%;
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .3s, color .3s;
  }
  .play-btn-mini:hover{ background:var(--accent); color:var(--bg-deep); }
  .play-btn-mini svg{ width:10px; height:10px; }

  .transport{
    display:flex; align-items:center; gap:0.7rem;
    width:min(360px, 80vw);
    font-size:0.7rem;
    color:var(--muted);
  }
  .bar{
    flex:1; height:1px; background:var(--line);
    position:relative; cursor:pointer;
    touch-action:none;
  }
  .bar::before{
    content:'';
    position:absolute;
    left:0; right:0; top:-12px; bottom:-12px;
  }
  .bar-fill{
    position:absolute; left:0; top:0; height:100%;
    background:var(--accent); width:0%;
    pointer-events:none;
  }
  .bar-thumb{
    position:absolute; top:50%; left:0%;
    width:10px; height:10px;
    background:var(--accent);
    border-radius:50%;
    transform:translate(-50%, -50%);
    box-shadow:0 0 0 4px var(--bg-mid);
    pointer-events:none;
  }

  .lyrics-toggle{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:0.75rem;
    letter-spacing:0.25em;
    padding:0.65rem 1.6rem;
    border-radius:999px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:0.6rem;
    margin-top:1.8rem;
    transition:background .3s, color .3s, border-color .3s;
  }
  .lyrics-toggle:hover{
    background:var(--line);
    color:var(--ink);
  }
  .lyrics-toggle-arrow{
    display:inline-block;
    transition:transform .35s ease;
    font-size:0.7em;
  }
  .lyrics-toggle.open .lyrics-toggle-arrow{
    transform:rotate(180deg);
  }

  /* ---------- LYRICS ---------- */
  .lyrics-section{
    max-width:640px;
    margin:0 auto;
    max-height:0;
    overflow:hidden;
    transition:max-height .5s ease;
  }
  .lyrics-inner{
    padding:2rem 8vw 6vh;
    display:flex;
    gap:2.4rem;
    position:relative;
  }
  .depth-gauge{
    position:relative;
    font-size:0.62rem;
    color:var(--muted);
    user-select:none;
    min-width:2.6rem;
  }
  .depth-gauge span{
    position:absolute;
    right:0;
    opacity:0.5;
    white-space:nowrap;
    line-height:1;
  }
  .lyrics{
    display:flex;
    flex-direction:column;
    gap:2.4rem;
    font-weight:300;
    font-size:0.9rem;
  }
  .stanza{
    display:flex;
    flex-direction:column;
  }
  .stanza p{
    color:var(--ink);
    opacity:0.82;
    line-height:1.45;
    margin:0.15rem 0;
  }

  footer{
    text-align:center;
    padding-bottom:8vh;
    font-size:0.62rem;
    letter-spacing:0.3em;
    color:var(--muted);
    opacity:0.45;
  }

  ::selection{ background:var(--accent); color:var(--bg-deep); }

  @media (prefers-reduced-motion: reduce){
    .ring, .freq, .disc img{ animation:none; }
  }
</style>
</head>

  <div class="transport">
    <button class="play-btn-mini" id="playBtn" aria-label="播放">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <span id="curTime">0:00</span>
    <div class="bar" id="seekBar"><div class="bar-fill" id="barFill"></div><div class="bar-thumb" id="barThumb"></div></div>
    <span id="durTime">0:00</span>
  </div>

  <button class="lyrics-toggle" id="lyricsToggle">
    <span id="lyricsToggleText">歌詞</span>
    <span class="lyrics-toggle-arrow" id="lyricsToggleArrow">▾</span>
  </button>
</section>

<section class="lyrics-section" id="lyricsSection">
  <div class="lyrics-inner" id="lyricsInner">
    <div class="depth-gauge" id="depthGauge"></div>
    <div class="lyrics" id="lyrics"></div>
  </div>
</section>
<footer>
  <p style="margin-bottom: 0.4rem; letter-spacing: 0.3em;">BORROWED LIGHT, KEPT WARM</p>
  <p style="opacity: 0.7; letter-spacing: 0.15em;">© 2026 CANDOR Studio</p>
</footer>

<audio id="audio" src="songz.mp3" preload="metadata"></audio>

<script>
/* ============================================================
   使用說明:
   time 是這句歌詞開始的秒數,目前是依歌曲長度和一般
   主歌/副歌節奏抓的「大概位置」,不是逐句聽出來的精確時間。
   建議之後邊聽邊微調 time 的數字,抓到準確的進歌詞時機。
   ============================================================ */

/* ============================================================
   歌詞就照順序放,不會跟播放進度連動,單純靜態呈現。
   每個子陣列是一個段落(stanza),段落內行距會比較緊,
   段落之間留比較大的空白。
   ============================================================ */

const lyricsData = [
  // [Verse 1]
  [
    "口袋藏著一盞壞掉的星星",
    "笑聲像紙屑飄過玻璃",
    "我把名字折成很小的陰影",
    "沿著牆角練習安靜"
  ],
  // [Pre-Chorus]
  [
    "有扇窗推向柔軟的南",
    "讓塵埃也學會轉彎",
    "我卻怕光照見舊裂的岸"
  ],
  // [Chorus]
  [
    "若借一點亮給灰色站牌",
    "枯葉也能跳成盛開",
    "那段寫在黑夜的獨白",
    "被掌心聽見 慢慢回來"
  ],
  // [Chorus 2]
  [
    "若借一點亮給灰色站牌",
    "陰影也能慢慢張開",
    "那句壓在心底的告白",
    "貼著你的心 不再離開"
  ],
  // [Verse 2]
  [
    "雨後街燈擦亮舊路口",
    "影子不再急著先逃走",
    "口是心非像生鏽的扣",
    "被一枚溫度輕輕解救"
  ],
  // [Chorus]
  [
    "就借這一點亮給灰色站牌",
    "等候的人終於明白",
    "那個習慣躲藏的小孩",
    "在你的掌心 溫柔盛開"
  ],
  // [Bridge]
  [
    "我曾把願望鎖進抽屜下方",
    "怕它一開口就跌得太快",
    "直到微風替紙頁翻過一行",
    "空白忽然長出微亮"
  ],
  // [Outro]
  [
    "若故事停在半開的窗台",
    "請把未說的 交給花開"
  ]
];


const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const seekBar = document.getElementById('seekBar');
const barFill = document.getElementById('barFill');
const barThumb = document.getElementById('barThumb');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const lyricsEl = document.getElementById('lyrics');
const depthGaugeEl = document.getElementById('depthGauge');

function fmt(s){
  if(!isFinite(s)) return "0:00";
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

// 建立歌詞 DOM(依段落分組)
lyricsData.forEach((stanza) => {
  const stanzaEl = document.createElement('div');
  stanzaEl.className = 'stanza';
  stanza.forEach((text) => {
    const p = document.createElement('p');
    p.textContent = text;
    stanzaEl.appendChild(p);
  });
  lyricsEl.appendChild(stanzaEl);
});

// 亮度刻度(裝飾用,呼應「借一點光」的意象):
// 依每個 stanza 實際的垂直位置換算亮度,數字隨歌詞往下推進而增加,
// 呼應歌曲從陰影走向亮起來的情緒線。
function layoutDepthGauge(){
  depthGaugeEl.innerHTML = '';
  const stanzaEls = document.querySelectorAll('.stanza');
  const pxPerUnit = 14; // 可依视觉效果微调，数字越小亮度增加越快
  stanzaEls.forEach((stanzaEl) => {
    const depth = document.createElement('span');
    const lux = Math.round((stanzaEl.offsetTop / pxPerUnit) / 5) * 5;
    depth.textContent = lux + ' lx';
    depth.style.top = stanzaEl.offsetTop + 'px';
    depthGaugeEl.appendChild(depth);
  });
}
layoutDepthGauge();
window.addEventListener('resize', layoutDepthGauge);
window.addEventListener('load', layoutDepthGauge);

// 歌詞展開/收合
const lyricsToggle = document.getElementById('lyricsToggle');
const lyricsSection = document.getElementById('lyricsSection');
const lyricsInner = document.getElementById('lyricsInner');
let lyricsOpen = false;

lyricsToggle.addEventListener('click', () => {
  lyricsOpen = !lyricsOpen;
  lyricsToggle.classList.toggle('open', lyricsOpen);

  if(lyricsOpen){
    layoutDepthGauge();
    lyricsSection.style.maxHeight = lyricsInner.scrollHeight + 'px';

    setTimeout(() => {
      const targetPosition = lyricsSection.getBoundingClientRect().top + window.pageYOffset;
      window.scrollTo({
        top: targetPosition,
        behavior: 'smooth'
      });
    }, 200);
  } else {
    lyricsSection.style.maxHeight = '0px';
  }
});

window.addEventListener('resize', () => {
  if(lyricsOpen) lyricsSection.style.maxHeight = lyricsInner.scrollHeight + 'px';
});

playBtn.addEventListener('click', () => {
  if(audio.paused){
    audio.play().catch(()=>{ /* 尚未放入音檔時避免報錯中斷 */ });
  } else {
    audio.pause();
  }
});

const discImg = document.getElementById('discImg');

audio.addEventListener('play', () => {
  playIcon.style.display = 'none';
  pauseIcon.style.display = 'block';
  discImg.style.animationPlayState = 'running';
});
audio.addEventListener('pause', () => {
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
  discImg.style.animationPlayState = 'paused';
});

audio.addEventListener('loadedmetadata', () => {
  durTimeEl.textContent = fmt(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  curTimeEl.textContent = fmt(audio.currentTime);
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  barFill.style.width = pct + '%';
  barThumb.style.left = pct + '%';
});

function seekRatioFromEvent(e){
  const rect = seekBar.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  return Math.min(1, Math.max(0, ratio));
}

let isSeeking = false;

seekBar.addEventListener('pointerdown', (e) => {
  isSeeking = true;
  seekBar.setPointerCapture(e.pointerId);
  e.preventDefault();
  const ratio = seekRatioFromEvent(e);
  if(audio.duration) audio.currentTime = ratio * audio.duration;
});

seekBar.addEventListener('pointermove', (e) => {
  if(!isSeeking) return;
  e.preventDefault();
  const ratio = seekRatioFromEvent(e);
  if(audio.duration) audio.currentTime = ratio * audio.duration;
});

seekBar.addEventListener('pointerup', () => { isSeeking = false; });
seekBar.addEventListener('pointercancel', () => { isSeeking = false; });

document.addEventListener('touchmove', (e) => {
  if(isSeeking) e.preventDefault();
}, { passive:false });
</script>
